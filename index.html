<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GxP Studio — Validation, Change Control &amp; Test Automation</title>
<meta name="description" content="GxP documentation, code migrations, bug fixes/CAPA and test automation with traceability, audit trail and Part 11 e-signatures.">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GxP Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{
  --bg:#f4f6fb;--panel:#ffffff;--panel2:#f8f9fc;--ink:#14182b;--ink2:#4a5170;--muted:#7a819c;--line:#e3e6f0;
  --brand:#4f46e5;--brand2:#7c3aed;--brandSoft:#eef0ff;--ok:#0f9d6b;--okSoft:#e3f7ef;--warn:#c27a00;--warnSoft:#fff4dc;
  --bad:#d23a4a;--badSoft:#fde8ea;--info:#0b7cc4;--infoSoft:#e2f2fc;--shadow:0 1px 2px rgba(20,24,43,.06),0 6px 20px rgba(20,24,43,.06);
  --r:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not(.light){
  --bg:#0d1020;--panel:#151a30;--panel2:#1a2038;--ink:#e8eaf6;--ink2:#b4b9d6;--muted:#8389a8;--line:#272e4c;
  --brandSoft:#24275a;--okSoft:#0f3328;--warnSoft:#3a2c0b;--badSoft:#3d1820;--infoSoft:#0d2c42;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root.dark{--bg:#0d1020;--panel:#151a30;--panel2:#1a2038;--ink:#e8eaf6;--ink2:#b4b9d6;--muted:#8389a8;--line:#272e4c;
  --brandSoft:#24275a;--okSoft:#0f3328;--warnSoft:#3a2c0b;--badSoft:#3d1820;--infoSoft:#0d2c42;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:650}
h3{font-size:15px;font-weight:650}
code,.mono{font-family:var(--mono);font-size:12.5px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.logo b{font-size:16px;display:block}.logo small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:550;font-size:14px}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--brandSoft);color:var(--brand)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:0 7px;color:var(--muted)}
.side .foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 22px;min-height:58px}
.top .crumb{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:4px 10px 4px 4px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:0 0 28px}
.userchip select{border:0;background:transparent;font-size:13px;font-weight:600;max-width:150px;cursor:pointer;outline:none}
.content{padding:22px;max-width:1280px;width:100%;margin:0 auto}
/* mobile nav */
.tabbar{display:none}
@media (max-width:860px){
  .side{display:none}
  .top{padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top))}
  .content{padding:14px 12px calc(var(--nav-h) + var(--safe-b) + 18px)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted)}
  .tabbar a .ic{font-size:19px;line-height:1}
  .tabbar a.on{color:var(--brand)}
  .userchip select{max-width:96px}
  .hide-m{display:none!important}
  h1{font-size:19px}
}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.card+.card{margin-top:14px}
.card h2{margin-bottom:10px}
.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph .t{flex:1;min-width:200px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dash2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.grid>.card{margin:0}
@media (max-width:700px){.g2,.g3,.dash2{grid-template-columns:1fr}}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.kpi .bar{height:6px;border-radius:6px;background:var(--panel2);margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink);min-height:38px}
.btn:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.btn.bad.armed{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;min-height:30px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--okSoft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--infoSoft);color:var(--info);border-color:transparent}
.pill.brand{background:var(--brandSoft);color:var(--brand);border-color:transparent}
.muted{color:var(--muted)}.small{font-size:12.5px}.b{font-weight:650}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--panel2)}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:74px}
.item .main1{flex:1;min-width:0}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.card.p0{padding:0;overflow:hidden}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;outline:none}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--brand);box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;outline:none;width:100%;font-weight:400;font-size:14px;color:var(--ink)}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
textarea.inp{min-height:90px;resize:vertical}
textarea.code,.codebox{font-family:var(--mono);font-size:12.5px;line-height:1.5;tab-size:2;white-space:pre;min-height:260px}
.codebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;max-height:440px;margin:0}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:550}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.steps span{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.steps span.done{background:var(--okSoft);color:var(--ok);border-color:transparent}
.steps span.cur{background:var(--brand);color:#fff;border-color:transparent}
.insight{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.insight:last-child{border-bottom:0}
.insight .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;font-size:14px;font-weight:800}
.insight.bad .dot{background:var(--badSoft);color:var(--bad)}.insight.warn .dot{background:var(--warnSoft);color:var(--warn)}.insight.ok .dot{background:var(--okSoft);color:var(--ok)}.insight.info .dot{background:var(--infoSoft);color:var(--info)}
.insight .tx{flex:1;font-size:13.5px}.insight .tx b{display:block;font-size:14px}
/* diff */
.diff{font-family:var(--mono);font-size:12px;line-height:1.55;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:520px;background:var(--panel)}
.diff .ln{display:flex;white-space:pre}
.diff .ln .n{width:42px;flex:0 0 42px;text-align:right;padding-right:8px;color:var(--muted);user-select:none;background:var(--panel2)}
.diff .ln .c{padding:0 10px;flex:1}
.diff .add{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.diff .del{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.diff .add .c::before{content:"+ ";color:var(--ok)}.diff .del .c::before{content:"- ";color:var(--bad)}.diff .eq .c::before{content:"  "}
.diff .gap{color:var(--muted);background:var(--panel2);padding:2px 10px;font-style:italic}
/* test console */
.console{background:#0b0e1c;color:#d6daf5;border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;max-height:420px;overflow:auto;white-space:pre-wrap}
.console .p{color:#4ade80}.console .f{color:#f87171}.console .d{color:#8b93c4}.console .h{color:#a5b4fc;font-weight:700}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-size:12px;font-weight:800}
.res.pass{background:var(--okSoft);color:var(--ok)}.res.fail{background:var(--badSoft);color:var(--bad)}.res.none{background:var(--panel2);color:var(--muted)}.res.err{background:var(--warnSoft);color:var(--warn)}
/* doc */
.doc{max-width:860px}
.docpaper{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 32px;line-height:1.6}
.docpaper h1{font-size:22px;margin:0 0 12px}.docpaper h2{font-size:17px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}.docpaper h3{margin:16px 0 6px}
.docpaper table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}
.docpaper th,.docpaper td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.docpaper th{background:var(--panel2)}
.docpaper ul{padding-left:20px}
.docpaper code{background:var(--panel2);padding:1px 5px;border-radius:5px}
.dochead{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px;font-size:12.5px}
.dochead div{padding:8px 10px;border-right:1px solid var(--line)}.dochead div:last-child{border-right:0}
.dochead span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:700px){.docpaper{padding:18px 16px}.dochead{grid-template-columns:1fr 1fr}.dochead div:nth-child(2){border-right:0}.dochead div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.sig{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--ok) 50%,var(--line));border-radius:10px;background:var(--okSoft);margin-top:8px;font-size:13px}
.sig .seal{font-size:20px}
.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.timeline .ev{position:relative;padding:0 0 12px;font-size:13px}
.timeline .ev:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--panel)}
.timeline .ev .when{color:var(--muted);font-size:12px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,28,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--panel);z-index:1}
.modal .mh h2{flex:1;margin:0}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}
@media (max-width:700px){.scrim{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;max-height:92vh}.modal .mf{padding-bottom:calc(12px + var(--safe-b))}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.err{color:var(--bad);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#14182b;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:550;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;animation:fade .2s}
@media (max-width:860px){.toast{bottom:calc(var(--nav-h) + var(--safe-b) + 14px)}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--brand);flex:0 0 18px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;flex:0 0 120px}
.ring div{width:92px;height:92px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-weight:750;font-size:22px}
.ring small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .br{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:12.5px}
.bars .tr{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;display:flex}
.bars .tr i{display:block;height:100%}
.matrix td.cell{text-align:center}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hashv{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.fab{display:none}
@media (max-width:860px){.fab{display:grid;position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:26px;place-items:center;z-index:25;box-shadow:0 8px 22px rgba(79,70,229,.45);border:0}}
@media print{
  .side,.top,.tabbar,.fab,.noprint{display:none!important}
  body{background:#fff;color:#000}.content{padding:0;max-width:none}.docpaper{border:0;padding:0}.card{box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">✓</div><div><b>GxP Studio</b><small>Validate · Migrate · Fix · Test</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Part 11 · Annex 11 · GAMP 5<br><span id="ver"></span> · offline-ready</div>

/* ---------- audit trail (hash chained) ---------- */
function audit(action,entity,detail,userId){

/* ---------- e-signature (21 CFR Part 11 style) ---------- */
function esign({record,meanings,title,onSign,requireReason=true,attach=true}){
  const u=me();

    <div class="small muted">By signing, you confirm this electronic signature is the legally binding equivalent of your handwritten signature (21 CFR 11.100).</div>

    ${typeof trainingWarn==='function'?trainingWarn(u.id):''}
    <label class="f">Meaning of signature<select class="inp" id="sgM">${meanings.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
    <label class="f">Reason / comment ${requireReason?'(required)':''}<input class="inp" id="sgR" placeholder="e.g. Reviewed against SOP-QA-012"></label>
    <label class="f">Re-enter password / PIN<input class="inp" id="sgP" type="password" autocomplete="off" inputmode="numeric" placeholder="Demo PIN for every user: 1234"></label>
    <div class="err" id="sgE"></div>`,
    `<button class="btn" data-x>Cancel</button><button class="btn pri" id="sgGo">✍ Sign</button>`);
  $('#sgGo',m).onclick=()=>{const pin=$('#sgP',m).value,reason=$('#sgR',m).value.trim(),meaning=$('#sgM',m).value;

    const sig={by:u.id,name:u.name,role:u.role,meaning,reason,at:nowISO(),version:record.version||null,hash:recordHash(record)};
    sig.sigHash=sha256(JSON.stringify(sig));
    if(attach)(record.signatures=record.signatures||[]).push(sig);
    audit('E-signed ('+meaning+')',record.id,reason);
    closeModal();onSign&&onSign(sig);save();render()};
}

/* ---------- mini markdown ---------- */
function md(src){
  const lines=String(src||'').split('\n');let out='',i=0;const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\b((?:DOC|REQ|TC|TR|CR|BUG|CV)-\d{4})\b/g,'<a href="#" data-goto="$1" class="mono">$1</a>');
  while(i<lines.length){const l=lines[i];
    if(/^```/.test(l)){let b=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))b.push(lines[i++]);i++;out+=`<pre class="codebox">${esc(b.join('\n'))}</pre>`;continue}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));out+='<div style="overflow:auto"><table><thead><tr>'+cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>'+body.slice(1).map(r=>'<tr>'+cells(r).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length;out+=`<h${n}>${inl(l.slice(n+1))}</h${n}>`;i++;continue}
    if(/^\s*[-*] /.test(l)){out+='<ul>';while(i<lines.length&&/^\s*[-*] /.test(lines[i]))out+=`<li>${inl(lines[i++].replace(/^\s*[-*] /,''))}</li>`;out+='</ul>';continue}
    if(/^\s*\d+\. /.test(l)){out+='<ol>';while(i<lines.length&&/^\s*\d+\. /.test(lines[i]))out+=`<li>${inl(lines[i++].replace(/^\s*\d+\. /,''))}</li>`;out+='</ol>';continue}
    if(!l.trim()){i++;continue}
    let p=[];while(i<lines.length&&lines[i].trim()&&!/^(#|\||```|\s*[-*] |\s*\d+\. )/.test(lines[i]))p.push(lines[i++]);out+=`<p>${inl(p.join(' '))}</p>`}
  return out}

/* ---------- line diff (LCS) ---------- */
function diffLines(a,b){a=String(a).split('\n');b=String(b).split('\n');const n=a.length,m=b.length;
  if(n*m>4e6)return {ops:[...a.map(t=>({t:'del',s:t})),...b.map(t=>({t:'add',s:t}))],add:m,del:n};
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[];let i=0,j=0,add=0,del=0;while(i<n&&j<m){if(a[i]===b[j]){ops.push({t:'eq',s:a[i],ai:i+1,bi:j+1});i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:'del',s:a[i],ai:i+1});i++;del++}else{ops.push({t:'add',s:b[j],bi:j+1});j++;add++}}
  while(i<n){ops.push({t:'del',s:a[i],ai:i+1});i++;del++}while(j<m){ops.push({t:'add',s:b[j],bi:j+1});j++;add++}return {ops,add,del}}
function diffHTML(a,b,ctx=3){const {ops,add,del}=diffLines(a,b);const keep=new Array(ops.length).fill(false);ops.forEach((o,k)=>{if(o.t!=='eq')for(let q=Math.max(0,k-ctx);q<=Math.min(ops.length-1,k+ctx);q++)keep[q]=true});
  let h='',skipped=0;ops.forEach((o,k)=>{if(!keep[k]){skipped++;return}if(skipped){h+=`<div class="gap">··· ${skipped} unchanged line${skipped>1?'s':''}</div>`;skipped=0}h+=`<div class="ln ${o.t}"><span class="n">${o.t==='del'?o.ai:o.bi}</span><span class="c">${esc(o.s)||' '}</span></div>`});
  if(skipped)h+=`<div class="gap">··· ${skipped} unchanged line${skipped>1?'s':''}</div>`;if(!add&&!del)h='<div class="gap">No differences</div>';return {html:`<div class="diff">${h}</div>`,add,del}}

/* ---------- test automation harness (runs in a Web Worker; falls back to main thread) ---------- */
function __harness(sutCode,tcs){
  class AssertionError extends Error{}
  const fmt=v=>{try{return v===undefined?'undefined':typeof v==='function'?'[function]':JSON.stringify(v)}catch(e){return String(v)}};
  const out=[];
  for(const tc of tcs){
    const t0=performance.now(),cases=[],logs=[];
    const con={log:(...a)=>logs.push(a.map(x=>typeof x==='object'?fmt(x):String(x)).join(' '))};con.info=con.warn=con.error=con.log;
    let sut={};
    try{const exports={};(new Function('exports','console',sutCode))(exports,con);sut=exports}
    catch(err){out.push({tc:tc.id,status:'Error',ms:0,cases:[{name:'Load system under test',status:'Error',msg:String(err&&err.message||err)}],logs});continue}
    const reg=[];const test=(name,fn)=>reg.push({name,fn});
    const expect=a=>{const fail=m=>{throw new AssertionError(m)};
      const api={
        toBe:b=>{if(!Object.is(a,b))fail(`expected ${fmt(a)} to be ${fmt(b)}`)},
        toEqual:b=>{if(fmt(a)!==fmt(b))fail(`expected ${fmt(a)} to equal ${fmt(b)}`)},
        toBeCloseTo:(b,d=2)=>{if(!(Math.abs(a-b)<Math.pow(10,-d)/2))fail(`expected ${fmt(a)} to be close to ${fmt(b)} (${d} dp)`)},
        toBeTruthy:()=>{if(!a)fail(`expected ${fmt(a)} to be truthy`)},
        toBeFalsy:()=>{if(a)fail(`expected ${fmt(a)} to be falsy`)},
        toBeGreaterThan:b=>{if(!(a>b))fail(`expected ${fmt(a)} > ${fmt(b)}`)},
        toBeGreaterThanOrEqual:b=>{if(!(a>=b))fail(`expected ${fmt(a)} >= ${fmt(b)}`)},
        toBeLessThan:b=>{if(!(a<b))fail(`expected ${fmt(a)} < ${fmt(b)}`)},
        toBeLessThanOrEqual:b=>{if(!(a<=b))fail(`expected ${fmt(a)} <= ${fmt(b)}`)},
        toContain:b=>{if(!(a!=null&&a.includes&&a.includes(b)))fail(`expected ${fmt(a)} to contain ${fmt(b)}`)},
        toMatch:re=>{if(!(new RegExp(re)).test(a))fail(`expected ${fmt(a)} to match ${re}`)},
        toHaveLength:n=>{if(!a||a.length!==n)fail(`expected length ${n}, got ${a&&a.length}`)},
        toThrow:m=>{let threw=false,msg='';try{a()}catch(e){threw=true;msg=String(e&&e.message||e)}if(!threw)fail('expected function to throw');if(m&&!msg.includes(m))fail(`expected error containing "${m}", got "${msg}"`)}
      };
      api.not={};for(const k of Object.keys(api))if(k!=='not')api.not[k]=(...x)=>{let passed=true;try{api[k](...x)}catch(e){passed=false}if(passed)fail(`expected NOT ${k}(${x.map(fmt).join(', ')}) for ${fmt(a)}`)};
      return api};
    try{(new Function('sut','test','expect','console',tc.script))(sut,test,expect,con)}
    catch(err){out.push({tc:tc.id,status:'Error',ms:+(performance.now()-t0).toFixed(1),cases:[{name:'Script error',status:'Error',msg:String(err&&err.message||err)}],logs});continue}
    if(!reg.length){out.push({tc:tc.id,status:'Error',ms:0,cases:[{name:'No test() blocks defined',status:'Error',msg:'Script registered no tests'}],logs});continue}
    for(const c of reg){const c0=performance.now();try{c.fn();cases.push({name:c.name,status:'Pass',ms:+(performance.now()-c0).toFixed(2)})}
      catch(e){cases.push({name:c.name,status:e instanceof AssertionError?'Fail':'Error',msg:String(e&&e.message||e),ms:+(performance.now()-c0).toFixed(2)})}}
    const st=cases.some(c=>c.status==='Error')?'Error':cases.some(c=>c.status==='Fail')?'Fail':'Pass';
    out.push({tc:tc.id,status:st,ms:+(performance.now()-t0).toFixed(1),cases,logs});
  }
  return out;
}
function runSuite(sutCode,tcs,timeoutMs=8000){
  const payload={sut:sutCode,tests:tcs.map(t=>({id:t.id,script:t.script||''}))};
  return new Promise(resolve=>{
    let w,done=false;const fallback=why=>{if(done)return;done=true;try{w&&w.terminate()}catch(e){}resolve({results:__harness(payload.sut,payload.tests),engine:'main thread'+(why?' ('+why+')':'')})};
    try{const src=`${__harness.toString()};onmessage=e=>postMessage(__harness(e.data.sut,e.data.tests));`;
      w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
      const timer=setTimeout(()=>{if(done)return;done=true;w.terminate();resolve({results:payload.tests.map(t=>({tc:t.id,status:'Error',ms:timeoutMs,cases:[{name:'Timeout',status:'Error',msg:`Execution exceeded ${timeoutMs/1000}s — possible infinite loop`}],logs:[]})),engine:'web worker (sandboxed)'})},timeoutMs);
      w.onmessage=e=>{if(done)return;done=true;clearTimeout(timer);w.terminate();resolve({results:e.data,engine:'web worker (sandboxed)'})};
      w.onerror=e=>{clearTimeout(timer);e.preventDefault&&e.preventDefault();fallback('worker unavailable')};
      w.postMessage(payload);
    }catch(e){fallback('worker unavailable')}
  });
}

function applyRules(code,rules){let out=String(code||'');const counts=[];const errors=[];
  rules.forEach((r,i)=>{if(r.off){counts.push(0);return}try{const re=new RegExp(r.find,r.flags||'g');const m=out.match(new RegExp(r.find,(r.flags||'g').includes('g')?r.flags||'g':(r.flags||'')+'g'));counts.push(m?m.length:0);out=out.replace(re,r.replace)}catch(e){counts.push(0);errors.push(`Rule ${i+1}: ${e.message}`)}});
  return {out,counts,errors}}

const SUT_V42=String.raw`// LabTrack LIMS — core calculation module v4.2
// GAMP 5 Category 5 (custom code). Validated baseline.
'use strict';

var DOSE_MAX_MG = 1000;

exports.calcDose = function (weightKg, mgPerKg) {
  if (typeof weightKg != 'number' || weightKg <= 0) throw new Error('Invalid weight');
  if (typeof mgPerKg != 'number' || mgPerKg <= 0) throw new Error('Invalid dose rate');
  var dose = Math.round(weightKg * mgPerKg * 10) / 10;
  if (dose > DOSE_MAX_MG) throw new Error('Dose exceeds maximum');
  return dose;
};

exports.withinSpec = function (value, low, high) {
  return value >= low && value <= high;
};

exports.tempExcursion = function (readings, min, max, allowedMinutes) {
  // readings: [{ t: minute, c: celsius }] sampled once per minute
  var out = 0;
  for (var i = 0; i < readings.length; i++) {
    if (readings[i].c < min || readings[i].c > max) out++;
  }
  return { minutesOut: out, excursion: out > allowedMinutes };
};

exports.batchId = function (site, year, seq) {
  var s = String(seq);
  while (s.length < 5) s = '0' + s;
  return site.toUpperCase() + '-' + year + '-' + s;
};

exports.isValidBatchId = function (id) {
  return /^[A-Z]{3}-\d{4}-\d{5}$/.test(id);
};

exports.hasRole = function (user, role) {
  return user.roles.indexOf(role) != -1;
};

exports.canApprove = function (record, user) {
  // segregation of duties: an author can never approve their own record
  if (record.author == user.id) return false;
  return exports.hasRole(user, 'QA');
};
`;

const UI={docF:'All',docQ:'',docT:'',crF:'Open',crQ:'',bugF:'Open',bugQ:'',tcQ:'',tcT:'All',tcSel:new Set(),tcTarget:'',auditQ:'',auditU:'',traceF:'All',tabs:{},verify:null,devF:'Open',devQ:''};

const hasRole=r=>me().roles.includes(r);

function guard(ok,msg){if(!ok)toast(msg);return ok}
const byAt=(a,b)=>a.at<b.at?-1:a.at>b.at?1:0;
function latestResult(tcId,filter){let best=null;for(const r of S.runs){if(filter&&!filter(r))continue;const x=r.results.find(z=>z.tc===tcId);if(x&&(!best||r.at>best.run.at))best={status:x.status,run:r,res:x}}return best}
const rpn=r=>r.risk.s*r.risk.p*r.risk.d;
const riskClass=n=>n>=12?'High':n>=6?'Medium':'Low';
function reqState(req){const tcs=S.tests.filter(t=>t.reqs.includes(req.id));if(!tcs.length)return {k:'none',label:'Not covered',tone:'bad',tcs};const lr=tcs.map(t=>latestResult(t.id));if(lr.some(x=>x&&x.status!=='Pass'))return {k:'fail',label:'Failing',tone:'bad',tcs,lr};if(lr.some(x=>!x))return {k:'notrun',label:'Not executed',tone:'warn',tcs,lr};return {k:'pass',label:'Verified',tone:'ok',tcs,lr}}
const openBug=d=>!['Verified','Closed'].includes(d.status);
const openCR=c=>!['Closed','Rejected'].includes(c.status);
const resIcon=s=>s==='Pass'?'<span class="res pass" title="Pass">✓</span>':s==='Fail'?'<span class="res fail" title="Fail">✕</span>':s==='Error'?'<span class="res err" title="Error">!</span>':'<span class="res none" title="Not run">–</span>';
const sigsAt=(rec,meaning)=>(rec.signatures||[]).filter(s=>s.meaning===meaning&&(!rec.version||!s.version||s.version===rec.version));
const tabsBar=(k,list,def)=>{const cur=UI.tabs[k]||def||list[0][0];return [cur,`<div class="tabs">${list.map(([v,l])=>`<button class="${v===cur?'on':''}" data-act="tab" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`]};
const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button class="${UI[k]===o?'on':''}" data-act="set" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
const histHTML=h=>(h&&h.length)?`<div class="timeline">${h.slice().reverse().map(x=>`<div class="ev"><b>${esc(x.text)}</b> · ${esc(userName(x.by))}<div class="when">${fmtUTC(x.at)}</div></div>`).join('')}</div>`:'<div class="muted small">No history.</div>';
const sigsHTML=rec=>(rec.signatures||[]).length?rec.signatures.slice().reverse().map(s=>sigBlock(s)+(s.version?`<div class="small muted" style="margin:-2px 0 4px 4px">Signed at version ${esc(s.version)}</div>`:'')).join(''):'<div class="muted small">No signatures yet.</div>';
const userOpts=sel=>S.users.map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)} — ${esc(u.role)}</option>`).join('');
const opts=(list,sel)=>list.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`}).join('');

/* ---------- insights ---------- */
function insights(){const I=[];const a=verifyAudit();
  if(!a.ok)I.push({t:'bad',i:'!',h:'Audit trail integrity failure',x:`Hash chain broken at entry #${a.at}. Investigate as a data integrity incident.`,href:'#/audit'});
  S.changes.filter(c=>['Implemented','Verified'].includes(c.status)&&c.lang==='javascript'&&c.tests.length).forEach(c=>{const h=sha256(c.targetCode);const last=S.runs.filter(r=>r.cr===c.id&&r.codeHash===h).sort(byAt).at(-1);
    if(!last)I.push({t:'warn',i:'▶',h:`${c.id}: regression not run on current candidate`,x:'Target code changed since the last recorded run — execute the regression suite before verification.',href:`#/change/${c.id}`});
    else{const f=last.results.filter(x=>x.status!=='Pass');if(f.length)I.push({t:'bad',i:'✕',h:`${c.id}: regression failing — release blocked`,x:`${f.length} of ${last.results.length} test cases failed in ${last.id} (${f.map(x=>x.tc).join(', ')}).`,href:'#/run/'+last.id})}});
  const crit=S.defects.filter(d=>openBug(d)&&['Critical','Major'].includes(d.severity));if(crit.length)I.push({t:'bad',i:'✱',h:`${crit.length} open Critical/Major defect${crit.length>1?'s':''}`,x:crit.map(d=>`${d.id} ${d.title}`).join(' · '),href:'#/defects'});
  S.docs.forEach(d=>{if(d.status==='Effective'&&d.reviewDue){const n=daysUntil(d.reviewDue);if(n<0)I.push({t:'bad',i:'↻',h:`Periodic review overdue: ${d.id}`,x:`${d.title} was due ${-n} days ago (${fmtD(d.reviewDue)}).`,href:'#/doc/'+d.id});else if(n<=30)I.push({t:'warn',i:'↻',h:`Periodic review due in ${n} days: ${d.id}`,x:d.title,href:'#/doc/'+d.id})}});
  const hiFail=S.reqs.filter(r=>r.gxp==='High'&&reqState(r).k==='fail');if(hiFail.length)I.push({t:'bad',i:'⊞',h:`${hiFail.length} High-GxP requirement${hiFail.length>1?'s':''} failing verification`,x:hiFail.map(r=>r.id).join(', '),href:'#/trace'});
  const unc=S.reqs.filter(r=>reqState(r).k==='none');if(unc.length)I.push({t:'warn',i:'⊞',h:`${unc.length} requirement${unc.length>1?'s':''} without test coverage`,x:unc.map(r=>`${r.id} ${r.text}`).join(' · '),href:'#/trace'});
  const nr=S.reqs.filter(r=>reqState(r).k==='notrun');if(nr.length)I.push({t:'warn',i:'▶',h:`${nr.length} requirement${nr.length>1?'s':''} with tests never executed`,x:nr.map(r=>r.id).join(', ')+' — execute the linked manual/automated tests.',href:'#/trace'});
  const noCapa=S.defects.filter(d=>openBug(d)&&d.gxp!=='Low'&&d.rootCause&&!(d.capa.corrective&&d.capa.preventive));if(noCapa.length)I.push({t:'warn',i:'✱',h:`${noCapa.length} defect${noCapa.length>1?'s':''} missing CAPA`,x:noCapa.map(d=>d.id).join(', '),href:'#/defects'});
  const inrev=S.docs.filter(d=>d.status==='In Review');if(inrev.length)I.push({t:'info',i:'▤',h:`${inrev.length} document${inrev.length>1?'s':''} awaiting review/approval`,x:inrev.map(d=>`${d.id} ${d.title}`).join(' · '),href:'#/docs'});
  const unsigned=S.runs.filter(r=>!sigsAt(r,'Reviewed').length);if(unsigned.length)I.push({t:'info',i:'✒',h:`${unsigned.length} test run${unsigned.length>1?'s':''} awaiting independent review`,x:unsigned.map(r=>r.id).join(', '),href:'#/tests'});
  const dvo=(S.deviations||[]).filter(devOverdue);if(dvo.length)I.push({t:'bad',i:'△',h:`${dvo.length} deviation${dvo.length>1?'s':''} past the 30-day closure target`,x:dvo.map(v=>`${v.id} ${v.title}`).join(' · '),href:'#/deviations'});
  const dvn=(S.deviations||[]).filter(v=>openDev(v)&&!v.immediate.trim());if(dvn.length)I.push({t:'warn',i:'△',h:`${dvn.length} deviation${dvn.length>1?'s':''} without containment`,x:dvn.map(v=>v.id).join(', '),href:'#/deviations'});
  let tO=0,tD=0;S.users.forEach(u=>trainingGaps(u.id).forEach(([,s])=>s.k==='Overdue'?tO++:tD++));if(tO)I.push({t:'bad',i:'◎',h:`${tO} overdue training assignment${tO>1?'s':''}`,x:'Users signing GxP records without current SOP training (21 CFR 11.10(i)).',href:'#/training'});if(tD)I.push({t:'warn',i:'◎',h:`${tD} training assignment${tD>1?'s':''} due`,x:'New effective SOP/policy versions require read-and-understood signatures.',href:'#/training'});
  const pend=S.changes.filter(c=>c.status==='Assessed');if(pend.length)I.push({t:'info',i:'⇄',h:`${pend.length} change${pend.length>1?'s':''} awaiting QA approval`,x:pend.map(c=>c.id+' '+c.title).join(' · '),href:'#/changes'});
  if(a.ok)I.push({t:'ok',i:'✓',h:'Audit trail intact',x:`${a.n} entries, SHA-256 hash chain verified (head ${short(a.head)}).`,href:'#/audit'});
  const o={bad:0,warn:1,info:2,ok:3};return I.sort((x,y)=>o[x.t]-o[y.t])}
const insightHTML=i=>`<a class="insight ${i.t}" href="${i.href}" style="color:inherit"><div class="dot">${i.i}</div><div class="tx"><b>${esc(i.h)}</b><span class="muted">${esc(i.x)}</span></div></a>`;

function readiness(c){const h=sha256(c.targetCode||'');const last=S.runs.filter(r=>r.cr===c.id&&r.codeHash===h).sort(byAt).at(-1);const bugs=S.defects.filter(d=>d.cr===c.id&&openBug(d));
  const items=[[sigsAt(c,'Approved').length>0,'QA approval before implementation'],[c.plan.every(p=>p.done),`Migration plan complete (${c.plan.filter(p=>p.done).length}/${c.plan.length})`]];
  if(c.lang==='javascript'&&c.tests.length)items.push([!!last&&last.results.every(x=>x.status==='Pass'),last?`Regression on current candidate: ${last.results.filter(x=>x.status==='Pass').length}/${last.results.length} pass (${last.id})`:'Regression on current candidate: not run']);
  items.push([!bugs.length,bugs.length?`${bugs.length} open linked defect${bugs.length>1?'s':''} (${bugs.map(b=>b.id).join(', ')})`:'No open linked defects']);
  items.push([sigsAt(c,'Verified').length>0,'Verification e-signature']);
  return items}

        ${bar('Test cases',[[lr.filter(x=>x.status==='Pass').length,'var(--ok)'],[lr.filter(x=>x.status!=='Pass').length,'var(--bad)'],[S.tests.length-lr.length,'#c7cbe0']],Math.max(1,S.tests.length))}

      </div></div>
      <div class="card"><div class="row"><h2 style="flex:1;margin:0">Recent activity</h2><a href="#/audit" class="small">Audit trail →</a></div><div class="timeline" style="margin-top:10px">${S.audit.slice(-7).reverse().map(e=>`<div class="ev"><b>${esc(e.action)}</b> ${e.entity!=='SYSTEM'?link(e.entity):''}<div class="when">${esc(userName(e.user))} · ${ago(e.at)}</div></div>`).join('')}</div></div>

/* ---------- documents ---------- */
const DOC_FLOW=['Draft','In Review','Approved','Effective'];
function vDocs(){
  const q=UI.docQ.toLowerCase();const list=S.docs.filter(d=>(UI.docF==='All'||d.status===UI.docF)&&(!UI.docT||d.type===UI.docT)&&(!q||(d.id+' '+d.title+' '+d.content).toLowerCase().includes(q)));
  return {title:'Documents',fab:'docNew',html:`<div class="ph"><div class="t"><h1>GxP documents</h1><p>Controlled documents with lifecycle, versioning and Part 11 e-signatures.</p></div><button class="btn pri hide-m" data-act="docNew">+ New document</button></div>
  <div class="toolbar"><input class="search" data-inp="docQ" placeholder="Search documents…" value="${esc(UI.docQ)}"><select class="inp" style="width:auto" data-chg="docT"><option value="">All types</option>${Object.entries(DOC_TYPES).map(([k,v])=>`<option value="${k}" ${UI.docT===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
  <div class="toolbar">${seg('docF',['All','Draft','In Review','Approved','Effective','Retired'])}</div>
  <div class="card p0 list">${list.length?list.map(d=>{const n=d.reviewDue&&d.status==='Effective'?daysUntil(d.reviewDue):null;return `<a class="item" href="#/doc/${d.id}"><span class="id">${d.id}</span><div class="main1"><div class="ttl">${esc(d.title)}</div><div class="meta"><span>${esc(DOC_TYPES[d.type]||d.type)}</span><span>v${esc(d.version)}</span><span>${esc(userName(d.owner))}</span>${n!=null?`<span style="color:${n<0?'var(--bad)':n<=30?'var(--warn)':'inherit'}">Review ${n<0?'overdue':'due'} ${fmtD(d.reviewDue)}</span>`:''}</div></div>${pill(d.status)}</a>`}).join(''):'<div class="empty">No documents match.</div>'}</div>`}}
CHG.docT=e=>{UI.docT=e.value;render()};
ACT.docNew=()=>{const m=modal('New controlled document',`
  <label class="f">Document type<select class="inp" id="ndT">${Object.entries(DOC_TYPES).map(([k,v])=>`<option value="${k}">${esc(v)} (${k})</option>`).join('')}</select></label>
  <label class="f">Title<input class="inp" id="ndN" placeholder="e.g. LabTrack LIMS v5.0 PQ Protocol"></label>
  <label class="f">Owner<select class="inp" id="ndO">${userOpts(S.currentUser)}</select></label>
  <label class="chk"><input type="checkbox" id="ndTpl" checked> Start from the GxP template for this type</label>`,`<button class="btn" data-x>Cancel</button><button class="btn pri" id="ndGo">Create draft</button>`);
  $('#ndGo',m).onclick=()=>{const title=val('ndN',m).trim();if(!title){toast('Title is required');return}const type=val('ndT',m);const id=nextId('DOC');
    let content=val('ndTpl',m)?(TEMPLATES[type]||'# {title}').replace('{title}',title):`# ${title}\n`;if(type==='RTM')content=rtmMarkdown(title);
    S.docs.unshift({id,type,title,version:'0.1',status:'Draft',owner:val('ndO',m),content,created:nowISO(),updated:nowISO(),effective:null,reviewDue:null,history:[{at:nowISO(),by:S.currentUser,text:'Created v0.1 draft'}],signatures:[]});
    audit('Document created',id,title);save();closeModal();UI.tabs.doc='edit';location.hash='#/doc/'+id}};
function docHead(d){return `<div class="dochead"><div><span>Document ID</span><b class="mono">${d.id}</b></div><div><span>Version</span><b>${esc(d.version)}</b></div><div><span>Status</span><b>${esc(d.status)}</b></div><div><span>${d.effective?'Effective':'Owner'}</span><b>${d.effective?fmtD(d.effective):esc(userName(d.owner))}</b></div></div>`}
function docHTML(d){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.id)} ${esc(d.title)}</title><style>body{font:14px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;max-width:820px;margin:30px auto;padding:0 20px;color:#111}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:5px 8px;text-align:left;vertical-align:top}th{background:#f3f4f8}.dochead{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #ccc;margin-bottom:16px}.dochead div{padding:6px 8px;border-right:1px solid #ccc}.dochead span{display:block;font-size:11px;color:#666;text-transform:uppercase}.sig{border:1px dashed #0a7;padding:8px;margin:6px 0;font-size:13px;display:flex;gap:8px}.hashv{font-family:monospace;font-size:11px;color:#666}.muted{color:#666}pre{background:#f5f5f8;padding:8px;overflow:auto}a{color:inherit;text-decoration:none}</style></head><body>${docHead(d)}${md(d.content)}<h2>Signature manifest</h2>${(d.signatures||[]).map(sigBlock).join('')||'<p>No signatures.</p>'}<p class="muted" style="font-size:11px;margin-top:30px">Exported from GxP Studio v${APP_VERSION} · ${fmtUTC(nowISO())} · record sha256 ${recordHash(d)}</p></body></html>`}
function vDoc(p){const d=S.docs.find(x=>x.id===p.id);if(!d)return {title:'Not found',html:'<div class="empty">Document not found.</div>'};
  const owner=d.owner===S.currentUser;const reviewed=sigsAt(d,'Reviewed').length>0;
  let acts='';
  if(d.status==='Draft')acts+=`<button class="btn pri" data-act="docSubmit">Submit for review</button>`;
  if(d.status==='In Review'){acts+=`<button class="btn" data-act="docReview">✍ Review &amp; sign</button><button class="btn pri" data-act="docApprove">✍ QA approve</button><button class="btn" data-act="docReturn">Return to draft</button>`}
  if(d.status==='Approved')acts+=`<button class="btn pri" data-act="docEffective">Make effective</button>`;
  if(d.status==='Effective')acts+=trainBtn(d)+`<button class="btn" data-act="docRevise">Revise (new version)</button><button class="btn" data-act="docPeriodic">✍ Periodic review</button><button class="btn bad" data-act="docRetire">Retire</button>`;
  if(d.status==='Draft'&&/^0\./.test(d.version))acts+=`<button class="btn bad" data-act="docDelete">Delete draft</button>`;
  const [tab,tb]=tabsBar('doc',[['view','Document'],...(d.status==='Draft'?[['edit','Edit']]:[]),['sig',`Signatures (${(d.signatures||[]).length})`],['hist','History']],'view');
  let body='';
  if(tab==='edit'&&d.status==='Draft')body=`<div class="card"><div class="fields"><label class="f">Title<input class="inp" id="deT" value="${esc(d.title)}"></label><label class="f">Owner<select class="inp" id="deO">${userOpts(d.owner)}</select></label></div>
    <label class="f" style="margin-top:12px">Content (Markdown: # headings, - lists, | tables |, **bold**, \`code\`; IDs like REQ-0001 auto-link)<textarea class="inp code" id="deC" style="min-height:420px;white-space:pre-wrap">${esc(d.content)}</textarea></label>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="tab" data-k="doc" data-v="view">Preview</button><button class="btn pri" data-act="docSave">Save draft</button></div></div>`;
  else if(tab==='sig')body=`<div class="card">${sigsHTML(d)}</div>`;
  else if(tab==='hist')body=`<div class="card">${histHTML(d.history)}</div>`;
  else body=`${vsrBanner(d)}<div class="docpaper">${docHead(d)}${md(d.content)}${(d.signatures||[]).length?`<h2>Signature manifest</h2>${d.signatures.map(sigBlock).join('')}`:''}</div>`;
  return {title:d.id,back:'#/docs',html:`<div class="doc" style="max-width:none">
    <div class="ph"><div class="t"><div class="row"><span class="mono muted">${d.id}</span>${pill(d.status)}<span class="pill brand">${esc(DOC_TYPES[d.type]||d.type)}</span><span class="pill">v${esc(d.version)}</span></div><h1 style="margin-top:6px">${esc(d.title)}</h1>
    <p>Owner ${esc(userName(d.owner))} · updated ${ago(d.updated)}${d.reviewDue?` · periodic review due ${fmtD(d.reviewDue)}`:''}${reviewed&&d.status==='In Review'?' · <b style="color:var(--ok)">reviewed</b>':''}</p>${stepper(DOC_FLOW,d.status==='Retired'||d.status==='Superseded'?'Effective':d.status)}</div></div>
    <div class="row noprint" style="margin-bottom:12px">${acts}<span style="flex:1"></span>${blobLink(docHTML(d),`${d.id}_v${d.version}.html`,'text/html','⬇ Export')}<button class="btn" onclick="window.print()">Print / PDF</button></div>
    ${tb}${body}</div>`}}
const curDoc=()=>S.docs.find(x=>x.id===parseHash().id);
ACT.docSave=()=>{const d=curDoc();const c=val('deC'),t=val('deT').trim(),o=val('deO');if(c===d.content&&t===d.title&&o===d.owner){toast('No changes');return}
  const [M,m]=d.version.split('.').map(Number);d.version=`${M}.${(m||0)+1}`;d.content=c;d.title=t||d.title;d.owner=o;d.updated=nowISO();hist(d,'Edited → v'+d.version);audit('Document modified',d.id,'v'+d.version);save();UI.tabs.doc='view';render();toast('Saved v'+d.version)};
ACT.docSubmit=()=>{const d=curDoc();d.status='In Review';d.updated=nowISO();hist(d,'Submitted for review (v'+d.version+')');audit('Submitted for review',d.id,'v'+d.version);save();render();toast('Submitted for review')};
ACT.docReview=()=>{const d=curDoc();if(!guard(d.owner!==S.currentUser,'Segregation of duties: the owner cannot review their own document. Switch user (top right).'))return;
  esign({record:d,meanings:['Reviewed'],title:'Review signature',onSign:()=>hist(d,'Reviewed by '+me().name)})};
ACT.docApprove=()=>{const d=curDoc();if(!guard(isQA(),'Only users with the QA role can approve. Switch to Morgan Lee (QA Approver).'))return;if(!guard(d.owner!==S.currentUser,'Segregation of duties: owner cannot approve own document.'))return;
  if(!guard(sigsAt(d,'Reviewed').length>0,'A review signature is required before QA approval.'))return;
  const vb=vsrBlock(d);if(!guard(!vb,vb))return;
  esign({record:d,meanings:['Approved'],title:'QA approval signature',onSign:()=>{d.status='Approved';d.updated=nowISO();hist(d,'Approved');audit('Status → Approved',d.id,'v'+d.version)}})};
ACT.docReturn=()=>{const d=curDoc();const m=modal('Return to draft',`<label class="f">Reason (recorded in audit trail)<textarea class="inp" id="rr"></textarea></label>`,`<button class="btn" data-x>Cancel</button><button class="btn pri" id="rrGo">Return</button>`);$('#rrGo',m).onclick=()=>{const r=val('rr',m).trim();if(!r){toast('Reason required');return}d.status='Draft';hist(d,'Returned to draft: '+r);audit('Returned to draft',d.id,r);save();closeModal();render()}};
ACT.docEffective=()=>{const d=curDoc();if(!guard(isQA(),'Only QA can make a document effective.'))return;const [M,m]=d.version.split('.').map(Number);if(m)d.version=`${M+1}.0`;
  d.status='Effective';d.effective=nowISO();d.reviewDue=new Date(Date.now()+730*DAY).toISOString();d.updated=nowISO();
  S.docs.filter(x=>x!==d&&x.supersededBy===d.id).forEach(x=>x.status='Superseded');hist(d,'Effective v'+d.version);audit('Made effective',d.id,'v'+d.version);save();render();toast('Effective v'+d.version)};
ACT.docRevise=()=>{const d=curDoc();d.history.push({at:nowISO(),by:S.currentUser,text:'Revision started from v'+d.version,snapshot:d.content});const [M]=d.version.split('.').map(Number);d.version=`${M}.1`;d.status='Draft';d.effective=null;d.updated=nowISO();audit('Revision started',d.id,'v'+d.version);save();UI.tabs.doc='edit';render()};
ACT.docPeriodic=()=>{const d=curDoc();esign({record:d,meanings:['Periodic review — no change required','Periodic review — revision required'],title:'Periodic review',onSign:s=>{if(/no change/.test(s.meaning))d.reviewDue=new Date(Date.now()+730*DAY).toISOString();hist(d,s.meaning);audit('Periodic review',d.id,s.meaning)}})};
ACT.docRetire=b=>{const d=curDoc();if(!guard(isQA(),'Only QA can retire documents.'))return;armed(b,()=>{d.status='Retired';hist(d,'Retired');audit('Document retired',d.id,'v'+d.version);save();render()})};
ACT.docDelete=b=>armed(b,()=>{const d=curDoc();S.docs=S.docs.filter(x=>x!==d);audit('Draft deleted',d.id,d.title);save();location.hash='#/docs'});

/* ---------- traceability ---------- */
function rtmMarkdown(title){return `# ${title||'Requirements Traceability Matrix'}\n\nGenerated ${fmtUTC(nowISO())} from live data. Coverage: ${S.reqs.filter(r=>reqState(r).k==='pass').length}/${S.reqs.length} requirements verified.\n\n| Requirement | Description | GxP | Risk (RPN) | Test cases | Latest result | Status |\n|---|---|---|---|---|---|---|\n`+
  S.reqs.map(r=>{const s=reqState(r);return `| ${r.id} | ${r.text} | ${r.gxp} | ${riskClass(rpn(r))} (${rpn(r)}) | ${s.tcs.map(t=>t.id).join(', ')||'—'} | ${s.tcs.map(t=>{const l=latestResult(t.id);return l?`${l.status} (${l.run.id})`:'Not run'}).join(', ')||'—'} | ${s.label} |`}).join('\n')+`\n\n## Open defects\n`+(S.defects.filter(openBug).map(d=>`- ${d.id} ${d.title} (${d.severity})`).join('\n')||'- None')}
function vTrace(p){const hl=p.q.get('req');
  const rows=S.reqs.map(r=>({r,s:reqState(r)})).filter(x=>UI.traceF==='All'||x.s.label===UI.traceF);
  const c=k=>S.reqs.filter(r=>reqState(r).k===k).length;
  return {title:'Traceability',fab:'reqNew',html:`<div class="ph"><div class="t"><h1>Requirements traceability</h1><p>URS → risk → test cases → evidence → defects. Click a requirement to edit it and its risk.</p></div><div class="row"><button class="btn" data-act="genRTM">▤ Generate RTM document</button><button class="btn pri hide-m" data-act="reqNew">+ Requirement</button></div></div>
  <div class="grid g4"><div class="card kpi"><div class="l">Verified</div><div class="v" style="color:var(--ok)">${c('pass')}</div></div><div class="card kpi"><div class="l">Failing</div><div class="v" style="color:var(--bad)">${c('fail')}</div></div><div class="card kpi"><div class="l">Not executed</div><div class="v" style="color:var(--warn)">${c('notrun')}</div></div><div class="card kpi"><div class="l">Not covered</div><div class="v">${c('none')}</div></div></div>
  <div class="toolbar" style="margin-top:14px">${seg('traceF',['All','Verified','Failing','Not executed','Not covered'])}</div>
  <div class="tblwrap"><table class="t matrix"><thead><tr><th>Req</th><th style="min-width:240px">Requirement</th><th>GxP</th><th>Risk</th><th>Tests &amp; latest result</th><th>Defects</th><th>Status</th></tr></thead><tbody>
  ${rows.map(({r,s})=>{const bugs=S.defects.filter(d=>openBug(d)&&s.tcs.some(t=>t.id===d.tc));return `<tr style="${hl===r.id?'background:var(--brandSoft)':''}"><td><a href="#" class="mono" data-act="reqEdit" data-id="${r.id}">${r.id}</a></td><td>${esc(r.text)}<div class="small muted">${esc(r.category)}</div></td><td>${pill(r.gxp)}</td><td>${pill(riskClass(rpn(r))+' · '+rpn(r),statusTone(riskClass(rpn(r))))}</td>
    <td>${s.tcs.map(t=>{const l=latestResult(t.id);return `<div class="row" style="gap:6px;flex-wrap:nowrap">${resIcon(l&&l.status)}<a href="#/test/${t.id}" class="mono">${t.id}</a>${l?`<a href="#/run/${l.run.id}" class="small muted mono">${l.run.id}</a>`:''}</div>`}).join('')||'<span class="muted">—</span>'}</td>
    <td>${bugs.map(b=>link(b.id)).join('<br>')||'<span class="muted">—</span>'}</td><td>${pill(s.label,s.tone)}</td></tr>`}).join('')}</tbody></table></div>`}}
function reqModal(r){const isNew=!r;r=r||{text:'',category:'',gxp:'High',risk:{s:2,p:2,d:2},source:''};const sc=n=>[1,2,3].map(v=>`<option ${v===n?'selected':''}>${v}</option>`).join('');
  const m=modal(isNew?'New requirement':`Edit ${r.id}`,`<label class="f">Requirement<textarea class="inp" id="rqT">${esc(r.text)}</textarea></label>
  <div class="fields"><label class="f">Category<input class="inp" id="rqC" value="${esc(r.category)}" placeholder="e.g. Part 11"></label><label class="f">GxP impact<select class="inp" id="rqG">${opts(['High','Medium','Low'],r.gxp)}</select></label><label class="f">Source document<select class="inp" id="rqD"><option value="">—</option>${S.docs.map(d=>`<option value="${d.id}" ${d.id===r.source?'selected':''}>${d.id} ${esc(d.title)}</option>`).join('')}</select></label></div>
  <div class="small b">FMEA risk (1 low – 3 high)</div><div class="fields"><label class="f">Severity<select class="inp" id="rqS">${sc(r.risk.s)}</select></label><label class="f">Probability<select class="inp" id="rqP">${sc(r.risk.p)}</select></label><label class="f">Detectability<select class="inp" id="rqDe">${sc(r.risk.d)}</select></label></div>
  <div class="small muted">RPN = S × P × D. ≥12 High, 6–11 Medium, ≤5 Low (SOP-QA-012 §4).</div>`,`<button class="btn" data-x>Cancel</button><button class="btn pri" id="rqGo">Save</button>`);
  $('#rqGo',m).onclick=()=>{const text=val('rqT',m).trim();if(!text){toast('Requirement text required');return}
    const o=isNew?{id:nextId('REQ'),created:nowISO()}:r;Object.assign(o,{text,category:val('rqC',m).trim(),gxp:val('rqG',m),source:val('rqD',m),risk:{s:+val('rqS',m),p:+val('rqP',m),d:+val('rqDe',m)}});
    if(isNew)S.reqs.push(o);audit(isNew?'Requirement created':'Requirement modified',o.id,`${o.gxp} · RPN ${rpn(o)}`);save();closeModal();render()}}
ACT.reqNew=()=>reqModal(null);
ACT.reqEdit=b=>reqModal(S.reqs.find(r=>r.id===b.dataset.id));
ACT.genRTM=()=>{const id=nextId('DOC');const title='LabTrack LIMS Requirements Traceability Matrix';S.docs.unshift({id,type:'RTM',title,version:'0.1',status:'Draft',owner:S.currentUser,content:rtmMarkdown(title),created:nowISO(),updated:nowISO(),history:[{at:nowISO(),by:S.currentUser,text:'Generated from live traceability data'}],signatures:[]});audit('Document generated',id,'RTM');save();UI.tabs.doc='view';location.hash='#/doc/'+id;toast('RTM generated as '+id)};

/* ---------- code baselines ---------- */
function codeTargets(){return [...S.code.map(c=>({id:c.id,label:`${c.id} · ${c.label} (${c.status})`,code:c.code,lang:c.lang})),...S.changes.filter(c=>c.targetCode&&openCR(c)).map(c=>({id:c.id,label:`${c.id} candidate · ${c.toLabel||'target'} (${c.status})`,code:c.targetCode,lang:c.lang}))]}
function vCode(p){
  if(p.id){const c=S.code.find(x=>x.id===p.id);if(!c)return {title:'Not found',html:'<div class="empty">Not found</div>'};
    const others=codeTargets().filter(x=>x.id!==c.id);const cmp=UI.codeCmp&&others.find(x=>x.id===UI.codeCmp)||others[0];const df=cmp?diffHTML(c.code,cmp.code):null;const okHash=sha256(c.code)===c.hash;
    return {title:c.id,back:'#/code',html:`<div class="ph"><div class="t"><div class="row"><span class="mono muted">${c.id}</span>${pill(c.status)}<span class="pill">${esc(c.lang)}</span></div><h1 style="margin-top:6px">${esc(c.title)}</h1><p>Registered ${fmtD(c.created)} by ${esc(userName(c.by))}${c.cr?` via ${link(c.cr)}`:''}</p></div>${blobLink(c.code,`${c.label}.js`,'text/javascript','⬇ Download')}</div>
    <div class="card"><div class="row"><b>SHA-256</b><span class="hashv" style="flex:1">${c.hash}</span>${okHash?pill('Integrity verified','ok'):pill('HASH MISMATCH','bad')}</div></div>
    <div class="card"><h2>Source</h2><pre class="codebox">${esc(c.code)}</pre></div>
    ${cmp?`<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0;flex:1">Compare</h2><select class="inp" style="width:auto" data-chg="codeCmp">${others.map(o=>`<option value="${o.id}" ${o.id===cmp.id?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div><div class="small muted" style="margin-bottom:8px"><span style="color:var(--ok)">+${df.add}</span> / <span style="color:var(--bad)">−${df.del}</span> lines</div>${df.html}</div>`:''}`}}
  return {title:'Code Baselines',html:`<div class="ph"><div class="t"><h1>Code baselines</h1><p>Validated, hash-sealed versions of the system under test. New baselines are promoted only by closing a change control.</p></div></div>

ACT.crNew=()=>{const m=modal('New change request',`<label class="f">Title<input class="inp" id="ncT" placeholder="e.g. Migrate reporting module to Python 3.11"></label>

  $('#ncGo',m).onclick=()=>{const title=val('ncT',m).trim();if(!title){toast('Title required');return}const lang=val('ncL',m);const b=lang==='javascript'?S.code.find(c=>c.id===val('ncB',m)):null;
    const pack={javascript:'es5-es2015',python:'py2-py3',sql:'oracle-pg'}[lang]||'custom';const id=nextId('CR');

    <div class="card"><h2>Description</h2>${early&&!locked?`<textarea class="inp" id="crD">${esc(c.description)}</textarea><label class="f" style="margin-top:10px">Justification<input class="inp" id="crJ" value="${esc(c.justification)}"></label><div class="fields" style="margin-top:10px"><label class="f">Title<input class="inp" id="crT" value="${esc(c.title)}"></label><label class="f">Target version label<input class="inp" id="crL" value="${esc(c.toLabel)}"></label><label class="f">Owner<select class="inp" id="crO">${userOpts(c.owner)}</select></label></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn pri" data-act="crSaveOv">Save</button></div>`:`<p>${esc(c.description)}</p><p class="muted small"><b>Justification:</b> ${esc(c.justification)}</p>`}</div>`;

  if(tab==='work')body=workbench(c,locked,early);
  if(tab==='plan')body=`<div class="card"><h2>Implementation &amp; rollback plan</h2>${c.plan.map((s,i)=>`<div class="chk" style="align-items:center"><input type="checkbox" data-chg="crStep" data-i="${i}" ${s.done?'checked':''} ${['Approved','Implemented'].includes(c.status)?'':'disabled'}><span style="flex:1;${s.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(s.step)}</span>${early?`<button class="btn sm ghost" data-act="crStepDel" data-i="${i}">✕</button>`:''}</div>`).join('')}

    body=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">Regression suite</h2>${c.lang==='javascript'&&!locked?`<button class="btn pri" data-act="crRun" ${c.targetCode?'':'disabled'}>▶ Run on candidate</button>`:''}</div>

function workbench(c,locked,early){

ACT.crApprove=()=>{const c=curCR();if(!guard(isQA(),'Only QA can approve changes. Switch to Morgan Lee (QA Approver).'))return;if(!guard(c.requester!==S.currentUser,'Requester cannot approve own change.'))return;

  const ob=S.defects.filter(d=>d.cr===c.id&&openBug(d));if(!guard(!ob.length,`Open linked defects: ${ob.map(d=>d.id).join(', ')}`))return;

CHG.crStep=e=>{const c=curCR();const s=c.plan[+e.dataset.i];s.done=e.checked;audit(s.done?'Plan step completed':'Plan step reopened',c.id,s.step);save();render()};
ACT.crStepAdd=()=>{const c=curCR();const v=val('psN').trim();if(!v)return;c.plan.push({step:v,done:false});audit('Plan step added',c.id,v);save();render()};

ACT.crSaveSrc=()=>{const c=curCR();const v=val('wbS');if(v===c.sourceCode){toast('No changes');return}c.sourceCode=v;audit('Source modified',c.id,'sha256 '+short(sha256(v)));save();render();toast('Source saved')};
ACT.crApply=()=>{const c=curCR();syncWB(c);const r=applyRules(c.sourceCode,c.rules);if(r.errors.length){toast(r.errors[0]);return}c.targetCode=r.out;if(!c.toLabel)c.toLabel='candidate';hist(c,`Rules applied (${r.counts.reduce((a,b)=>a+b,0)} replacements)`);audit('Migration rules applied',c.id,`${RULE_PACKS[c.pack]?.name||c.pack} → sha256 ${short(sha256(c.targetCode))}`);if(c.status==='Verified'){c.status='Implemented';hist(c,'Returned to Implemented (target changed)')}save();UI.wbView='diff';render();toast('Target written')};

ACT.crDoc=()=>{const c=curCR();const id=nextId('DOC');const last=crLastRun(c);
  const content=`# Change Control Record — ${c.id}\n\n| Field | Value |\n|---|---|\n| Title | ${c.title} |\n| Type | ${c.type} |\n| Status | ${c.status} |\n| Risk | ${c.risk} |\n| GAMP category | ${c.gamp} |\n| Requester | ${userName(c.requester)} |\n| From baseline | ${c.fromCV||'—'} |\n| Target | ${c.toLabel||'—'} |\n| Target sha256 | ${c.targetCode?sha256(c.targetCode):'—'} |\n\n## Description\n${c.description}\n\n## Justification\n${c.justification}\n\n## Impact assessment\n`+IMPACTS.map(([k,l])=>`- ${c.impact[k]?'**Yes**':'No'} — ${l}`).join('\n')+`\n\n${c.impactNotes}\n\n## Migration rules applied\n| # | Rule | Pattern |\n|---|---|---|\n`+(c.rules.filter(r=>!r.off).map((r,i)=>`| ${i+1} | ${r.desc} | \`${r.find.replace(/\|/g,'\\u007c')}\` |`).join('\n')||'| — | none | |')+`\n\n## Plan\n`+c.plan.map(s=>`- ${s.done?'[x]':'[ ]'} ${s.step}`).join('\n')+`\n\n## Verification evidence\n`+(last?`Regression ${last.id} (${fmtUTC(last.at)}): ${last.results.filter(x=>x.status==='Pass').length}/${last.results.length} passed. Evidence sha256 ${last.hash}.`:'No regression run on current candidate.')+`\n\n## Linked defects\n`+(S.defects.filter(d=>d.cr===c.id).map(d=>`- ${d.id} ${d.title} — ${d.status}`).join('\n')||'- None')+`\n\n## Signatures\n`+(c.signatures||[]).map(s=>`- ${s.meaning}: ${s.name} (${s.role}) ${fmtUTC(s.at)} — ${s.reason}`).join('\n');
  S.docs.unshift({id,type:'CCR',title:`Change Control Record ${c.id}`,version:'0.1',status:'Draft',owner:S.currentUser,content,created:nowISO(),updated:nowISO(),history:[{at:nowISO(),by:S.currentUser,text:'Generated from '+c.id}],signatures:[]});audit('Document generated',id,'Change record for '+c.id);save();UI.tabs.doc='view';location.hash='#/doc/'+id};

/* ---------- test execution ---------- */
async function executeRun(tcs,code,target,label,cr){const {results,engine}=await runSuite(code,tcs);
  results.forEach(r=>{const t=S.tests.find(x=>x.id===r.tc);r.testVersion=t.version;r.testStatus=t.status});
  const run={id:nextId('TR'),at:nowISO(),by:S.currentUser,target,codeLabel:label,codeHash:sha256(code),cr:cr||null,engine,results,signatures:[]};run.hash=sha256(JSON.stringify(run.results));S.runs.push(run);
  audit('Test run executed',run.id,`${results.filter(x=>x.status==='Pass').length}/${results.length} passed on ${label}`);save();return run}
function vTests(){const [tab,tb]=tabsBar('tests',[['cases',`Test cases (${S.tests.length})`],['runs',`Test runs (${S.runs.length})`]],'cases');

  let body='';
  if(tab==='cases'){const q=UI.tcQ.toLowerCase();const list=S.tests.filter(t=>(UI.tcT==='All'||t.type===UI.tcT)&&(!q||(t.id+' '+t.title).toLowerCase().includes(q)));const sel=[...UI.tcSel].filter(id=>S.tests.find(t=>t.id===id&&t.mode==='auto'));
    body=`<div class="card" style="margin-bottom:12px"><div class="row"><b style="flex:1;min-width:140px">Execute automated suite</b><select class="inp" style="width:auto;max-width:100%" data-chg="tcTarget">${targets.map(t=>`<option value="${t.id}" ${t.id===UI.tcTarget?'selected':''}>${esc(t.label)}</option>`).join('')}</select><button class="btn" data-act="tcSelAll">Select all automated</button><button class="btn pri" data-act="tcRunSel" ${sel.length&&UI.tcTarget?'':'disabled'}>▶ Run ${sel.length||''} &amp; record</button></div><div class="small muted" style="margin-top:6px">Tests run in a sandboxed Web Worker against the selected code version. Results are hash-sealed as GxP evidence.</div></div>
    <div class="toolbar"><input class="search" data-inp="tcQ" placeholder="Search tests…" value="${esc(UI.tcQ)}">${seg('tcT',['All','IQ','OQ','PQ'])}</div>
    <div class="card p0 list">${list.map(t=>{const l=latestResult(t.id);return `<div class="item" style="cursor:default">${t.mode==='auto'?`<input type="checkbox" data-chg="tcSel" data-id="${t.id}" ${UI.tcSel.has(t.id)?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">`:'<span style="width:18px"></span>'}${resIcon(l&&l.status)}<a href="#/test/${t.id}" class="main1" style="color:inherit"><div class="ttl">${esc(t.title)}</div><div class="meta"><span class="mono">${t.id}</span><span>${t.type}</span><span>${t.mode==='auto'?'Automated':'Manual'}</span><span>v${t.version}</span><span>${t.reqs.join(', ')||'no requirements'}</span></div></a>${pill(t.status)}</div>`}).join('')||'<div class="empty">No tests.</div>'}</div>`}
  else body=`<div class="card p0 list">${S.runs.slice().reverse().map(r=>{const p=r.results.filter(x=>x.status==='Pass').length;return `<a class="item" href="#/run/${r.id}"><span class="id">${r.id}</span><div class="main1"><div class="ttl">${esc(r.codeLabel)}</div><div class="meta"><span>${fmtDT(r.at)}</span><span>${esc(userName(r.by))}</span><span>${r.results.length} test case${r.results.length>1?'s':''}</span>${sigsAt(r,'Reviewed').length?'<span style="color:var(--ok)">✓ reviewed</span>':''}</div></div>${pill(`${p}/${r.results.length} pass`,p===r.results.length?'ok':'bad')}</a>`}).join('')||'<div class="empty">No runs yet.</div>'}</div>`;
  return {title:'Test Automation',fab:'tcNew',html:`<div class="ph"><div class="t"><h1>Test automation</h1><p>Scripted IQ/OQ/PQ test cases — automated (JavaScript assertions) or manual step-by-step — traced to requirements.</p></div><button class="btn pri hide-m" data-act="tcNew">+ New test case</button></div>${tb}${body}`}}

ACT.tcNew=()=>{const m=modal('New test case',`<label class="f">Title<input class="inp" id="ntT" placeholder="e.g. Dose ceiling for pediatric patients"></label><div class="fields"><label class="f">Type<select class="inp" id="ntY">${opts(['OQ','PQ','IQ','Unit','Regression'])}</select></label><label class="f">Mode<select class="inp" id="ntM">${opts([['auto','Automated (script)'],['manual','Manual (steps)']])}</select></label></div>`,`<button class="btn" data-x>Cancel</button><button class="btn pri" id="ntGo">Create</button>`);
  $('#ntGo',m).onclick=()=>{const title=val('ntT',m).trim();if(!title){toast('Title required');return}const id=nextId('TC');const mode=val('ntM',m);
    S.tests.push({id,title,type:val('ntY',m),reqs:[],mode,script:mode==='auto'?`test('describe the expected behaviour', () => {\n  // sut = exports of the system under test\n  expect(sut.withinSpec(100, 95, 105)).toBe(true);\n});`:'',steps:mode==='manual'?[{action:'',expected:''}]:[],status:'Draft',version:'0.1',author:S.currentUser,created:nowISO()});
    audit('Test case created',id,title);save();closeModal();location.hash='#/test/'+id}};
const curTC=()=>S.tests.find(x=>x.id===parseHash().id);
const API_HELP=`test(name, fn) · expect(x).toBe(y) · .toEqual(obj) · .toBeCloseTo(n, dp) · .toBeTruthy() · .toBeFalsy() · .toBeGreaterThan(n) · .toBeLessThan(n) · .toContain(v) · .toMatch(re) · .toHaveLength(n) · .toThrow(msg) · .not.toBe(y) · console.log() · sut.* = system-under-test exports`;

  <div class="row" style="margin-bottom:12px">${t.status==='Draft'?'<button class="btn" data-act="tcApprove">✍ QA approve test</button>':''}${t.mode==='auto'?`<button class="btn" data-act="tcDry">▷ Dry run vs ${esc(baseline?baseline.label:'baseline')} (not recorded)</button>`:`<button class="btn pri" data-act="tcManual">▶ Execute &amp; record</button>`}</div>
  <div id="dry"></div>
  <div class="grid g2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="card">
    <div class="fields"><label class="f">Title<input class="inp" id="tT" value="${esc(t.title)}"></label><label class="f">Type<select class="inp" id="tY">${opts(['IQ','OQ','PQ','Unit','Regression'],t.type)}</select></label></div>
    ${t.mode==='auto'?`<label class="f" style="margin-top:12px">Automated script<textarea class="inp code" id="tS" style="min-height:340px">${esc(t.script)}</textarea></label><div class="small muted" style="margin-top:6px;font-family:var(--mono);font-size:11px">${esc(API_HELP)}</div>`:
      `<div class="small b" style="margin-top:14px">Steps</div>${t.steps.map((s,i)=>`<div class="fields" style="margin-top:8px;grid-template-columns:24px 1fr 1fr 34px;align-items:start"><b class="muted" style="padding-top:9px">${i+1}</b><textarea class="inp" style="min-height:60px" data-step="a${i}" placeholder="Action">${esc(s.action)}</textarea><textarea class="inp" style="min-height:60px" data-step="e${i}" placeholder="Expected result">${esc(s.expected)}</textarea><button class="btn sm ghost" data-act="tcStepDel" data-i="${i}">✕</button></div>`).join('')}<button class="btn sm" style="margin-top:8px" data-act="tcStepAdd">+ Step</button>`}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" data-act="tcSave">Save test case</button></div></div>
